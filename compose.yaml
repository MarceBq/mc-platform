services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "26.1"
      MEMORY: "4G"
      ONLINE_MODE: "FALSE"
      MOTD: "mc-platform - laboratorio de agentes"
    volumes:
      - ./minecraft-data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: bot-agente01
    environment:
      MC_HOST: minecraft
      MC_PORT: "25565"
      BOT_NAME: Agente01
    depends_on:
      minecraft:
        condition: service_healthy
    restart: unless-stopped